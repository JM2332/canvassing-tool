<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KML Foodservice — Canvassing Planner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231C3A2B'/%3E%3Ctext x='16' y='21' font-family='Arial,Helvetica,sans-serif' font-size='11' font-weight='700' fill='%23CDDC5C' text-anchor='middle'%3EKML%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<link rel="stylesheet" href="style.css?v=202608101600">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
</head>
<body>

<div id="login-overlay">
  <form id="login-form">
    <span id="login-logo-mark">KML</span>
    <h2>KML Foodservice</h2>
    <p>Enter the shared passcode to continue</p>
    <input type="password" id="login-passcode" placeholder="Passcode" autocomplete="current-password" autofocus>
    <button type="submit" class="btn-primary">Unlock</button>
    <div id="login-error"></div>
  </form>
</div>

<header id="topbar">
  <div id="brand">
    <span id="logo-mark">KML</span>
    <h1>KML Foodservice <span class="subtitle">Canvassing Planner</span></h1>
  </div>
  <form id="search-form">
    <label>Postcode / place
      <input type="text" id="postcode-input" value="S71 1HN" autocomplete="off">
    </label>
    <label>Radius (miles)
      <input type="number" id="radius-input" value="25" min="1" max="60" step="1">
    </label>
    <button type="submit" id="load-btn" class="btn-primary">
      <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      Load venues
    </button>
    <span id="load-status" aria-live="polite"></span>
  </form>
</header>

<div id="main">
  <aside id="sidebar">
    <div id="filters">
      <div class="filter-group" id="type-filters"></div>
      <div class="filter-group">
        <label>Status
          <select id="status-filter">
            <option value="">All statuses</option>
          </select>
        </label>
        <label>Last visited
          <select id="visited-filter">
            <option value="">Any time</option>
            <option value="last7">Visited in last 7 days</option>
            <option value="last30">Visited in last 30 days</option>
            <option value="stale30">Not visited 30+ days</option>
          </select>
        </label>
        <label class="checkbox-row">
          <input type="checkbox" id="hide-not-interested">
          Hide "Not interested"
        </label>
        <label class="checkbox-row">
          <input type="checkbox" id="show-chains">
          Include national chains
        </label>
        <label class="checkbox-row">
          <input type="checkbox" id="priority-only">
          Priority leads only
        </label>
        <label class="checkbox-row">
          <input type="checkbox" id="needs-followup">
          Needs follow-up (Interested, 14+ days)
        </label>
      </div>
      <div class="filter-group">
        <input type="text" id="search-box" placeholder="Search name or address…">
      </div>
      <div class="filter-group" id="results-summary"></div>
    </div>

    <div id="venue-list"></div>

    <div id="route-bar">
      <span id="route-count">0 selected</span>
      <button id="route-btn" class="btn-primary" disabled>
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 20l-5.5-2V4L9 6m0 14 6-2m-6 2V6m6 12 5.5 2V6L15 4m0 14V4m0 0L9 6"/></svg>
        <span id="route-btn-label">Maps</span>
      </button>
      <button id="clear-route-btn" class="btn-outline">Clear</button>
      <button id="view-route-btn" class="btn-outline" disabled>
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        Today's route
      </button>
    </div>

    <div id="data-actions">
      <button id="export-csv-btn" class="btn-outline">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
        Export CSV
      </button>
      <button id="export-json-btn" class="btn-outline">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
        Backup (JSON)
      </button>
      <button id="import-json-btn" class="btn-outline file-btn">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
        Restore backup
      </button>
      <input type="file" id="import-file-input" accept="application/json" style="display:none">
    </div>
  </aside>

  <main id="map"></main>
</div>

<div id="detail-overlay" class="overlay hidden">
  <div id="detail-panel" class="overlay-panel">
    <button id="detail-close" class="modal-close">&times;</button>
    <div id="detail-content"></div>
  </div>
</div>

<div id="route-overlay" class="overlay hidden">
  <div id="route-panel" class="overlay-panel">
    <button id="route-close" class="modal-close">&times;</button>
    <h2>Today's Route</h2>
    <p id="route-panel-sub">Stops in driving order — tick off as you go.</p>
    <div id="route-list"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="app.js?v=202608101600"></script>
</body>
</html>
